services:
  - type: web
    name: fraud-lens
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn fraud_lens.app:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /health
    envVars:
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
